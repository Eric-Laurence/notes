project:
  type: website
  output-dir: _site

website:
  title: "Notes"
  description: "Math notes by Eric Laurence"
  site-url: https://eric-laurence.github.io/notes
  repo-url: https://github.com/Eric-Laurence/notes
  navbar:
    right:
      - text: Posts
        href: index.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/Eric-Laurence/notes
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS
  search:
    location: navbar
    type: textbox
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    # Quarto hardcodes the "light" slot as the primary stylesheet regardless
    # of YAML order, so dark is placed there to make it the actual default.
    theme:
      light: [darkly, theme-darkly.scss]
      dark: [cosmo, theme-cosmo.scss]
    css: styles.css
    toc: true
    html-math-method: mathjax
    anchor-sections: true
    code-copy: true
    include-after-body: canary.html

execute:
  freeze: auto

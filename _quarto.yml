project:
  type: website
  output-dir: _site

website:
  title: "Notes"
  description: "Math notes by Eric Laurence"
  site-url: https://eric-laurence.github.io/notes
  repo-url: https://github.com/Eric-Laurence/notes
  navbar:
    right:
      - text: Posts
        href: index.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/Eric-Laurence/notes
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS
  search:
    location: navbar
    type: textbox
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: [cosmo, theme-light.scss]
    css: styles.css
    toc: true
    html-math-method: mathjax
    anchor-sections: true
    code-copy: true
    include-in-header: init-dark.html
    include-after-body: canary.html

execute:
  freeze: auto

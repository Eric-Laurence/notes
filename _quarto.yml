project:
  type: website
  output-dir: _site
  resources:
    - rss-style.xsl
    - paper-noise.svg
  post-render:
    - scripts/add-rss-stylesheet.py
    - scripts/append-byline.py

website:
  title: "Notes"
  description: "Math notes by Eric Laurence"
  site-url: https://eric-laurence.github.io/notes
  repo-url: https://github.com/Eric-Laurence/notes
  navbar:
    right:
      - text: Posts
        href: index.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/Eric-Laurence/notes
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS
  search:
    location: navbar
    type: textbox
  page-navigation: true
  back-to-top-navigation: false
  page-footer:
    center: "© 2026 Eric Laurence. All rights reserved."

format:
  html:
    theme:
      dark: [darkly, theme-darkly.scss]
      light: [cosmo, theme-cosmo.scss]
    css: styles.css
    toc: true
    html-math-method: katex
    anchor-sections: true
    code-copy: true
    highlight-style:
      light: solarized
      dark: atom-one
    include-before-body:
      - paper-noise-overlay.html
    include-after-body:
      - extend-byline.html

execute:
  freeze: auto
